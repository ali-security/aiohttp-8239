name: cp34-macos-spike
on:
  push:
    branches: [spike/macos-cp34-src]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.10"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout (spike branch tree)
        uses: actions/checkout@v4

      - name: Env dump
        run: |
          set -x
          uname -a; sw_vers || true; clang --version; xcrun --show-sdk-path; xcrun --show-sdk-version

      - name: Ensure zlib headers (brew)
        run: |
          set -x
          brew list zlib >/dev/null 2>&1 || brew install zlib
          ls -la "$(brew --prefix zlib)/include" "$(brew --prefix zlib)/lib"

      - name: Build CPython 3.4.10 from source (x86_64, WITH zlib)
        run: |
          set -x
          cd /tmp
          curl -sSLO https://www.python.org/ftp/python/3.4.10/Python-3.4.10.tgz
          tar xzf Python-3.4.10.tgz
          cd Python-3.4.10
          if ! grep -q 'sys/random.h' Python/random.c; then
            perl -0pi -e 's{#include "Python.h"}{#include "Python.h"\n#include <sys/random.h>}' Python/random.c || true
          fi
          SDK="$(xcrun --show-sdk-path)"
          ZP="$(brew --prefix zlib)"
          DEMOTE="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          export CFLAGS="-isysroot $SDK -arch x86_64 $DEMOTE -I$ZP/include"
          export CPPFLAGS="-isysroot $SDK -I$ZP/include -I$SDK/usr/include"
          export LDFLAGS="-isysroot $SDK -arch x86_64 -L$ZP/lib"
          export CPATH="$ZP/include:$SDK/usr/include"
          export LIBRARY_PATH="$ZP/lib:$SDK/usr/lib"
          export ARCHFLAGS="-arch x86_64"
          ./configure --prefix=/tmp/py34 --enable-shared --without-ensurepip MACOSX_DEPLOYMENT_TARGET=10.10 >/tmp/raw-configure.log 2>&1
          make -j"$(sysctl -n hw.ncpu)" >/tmp/raw-make.log 2>&1
          make install >/tmp/raw-install.log 2>&1
          grep -nE 'necessary bits|Failed to build|zlib' /tmp/raw-make.log || true

      - name: Verify python has zlib + DEFLATE
        id: findpy
        run: |
          set -x
          PY=/tmp/py34/bin/python3.4
          export DYLD_LIBRARY_PATH=/tmp/py34/lib
          "$PY" -c "import sys,platform;print(sys.version);print(platform.machine())"
          "$PY" -c "import zlib;print('zlib OK',zlib.ZLIB_VERSION)"
          "$PY" -c "import zipfile;zipfile._check_compression(zipfile.ZIP_DEFLATED);print('DEFLATE OK')"
          echo "py=$PY" >> "$GITHUB_OUTPUT"

      - name: Build deps + aiohttp wheel
        run: |
          set -x
          PY="${{ steps.findpy.outputs.py }}"
          export DYLD_LIBRARY_PATH=/tmp/py34/lib
          mkdir -p /tmp/wh; cd /tmp/wh
          curl -sSLO https://files.pythonhosted.org/packages/6b/6a/fa8d20fb8b661854a7140e290c52693ab3e8afdc9a8a7bf1194d9a227918/Cython-0.27.1-cp34-cp34m-macosx_10_6_intel.macosx_10_9_intel.macosx_10_9_x86_64.macosx_10_10_intel.macosx_10_10_x86_64.whl
          curl -sSLO https://files.pythonhosted.org/packages/91/af/18d58ed8a8e7e6b91d71b0367034faf8ea41e1004018811388ed07a7f2d6/setuptools-43.0.0-py2.py3-none-any.whl
          curl -sSLO https://files.pythonhosted.org/packages/0c/80/16a85b47702a1f47a63c104c91abdd0a6704ee8ae3b4ce4afc49bc39f9d9/wheel-0.30.0-py2.py3-none-any.whl
          SP="$("$PY" -c 'import site;print(site.getsitepackages()[0])')"
          for w in *.whl; do "$PY" -m zipfile -e "$w" "$SP"; done
          "$PY" -c "import Cython,setuptools,wheel;print('Cython',Cython.__version__,'setuptools',setuptools.__version__,'wheel',wheel.__version__)"
          cd "$GITHUB_WORKSPACE"
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          export ARCHFLAGS="-arch x86_64"
          export MACOSX_DEPLOYMENT_TARGET=10.10
          "$PY" setup.py bdist_wheel -d "$GITHUB_WORKSPACE/wheelhouse" >/tmp/wheel-build.log 2>&1
          tail -5 /tmp/wheel-build.log
          ls -la "$GITHUB_WORKSPACE/wheelhouse"

      - name: Verify .so (x86_64 + dep-free load, py34 API)
        run: |
          set -x
          PY="${{ steps.findpy.outputs.py }}"
          export DYLD_LIBRARY_PATH=/tmp/py34/lib
          WHL=$(ls "$GITHUB_WORKSPACE"/wheelhouse/aiohttp-*.whl | head -1)
          echo "WHL=$WHL"
          "$PY" -m zipfile -l "$WHL" | grep -E '_vendored/_brotli.*\.so' && echo "BROTLI SO PRESENT"
          mkdir -p /tmp/whx; "$PY" -m zipfile -e "$WHL" /tmp/whx
          SO=$(find /tmp/whx -name '_brotli*.so' | head -1)
          echo "SO=$SO"; lipo -info "$SO"
          # Python 3.4-compatible dep-free extension load (module_from_spec is 3.5+)
          "$PY" -c "from importlib.machinery import ExtensionFileLoader; m=ExtensionFileLoader('_brotli','$SO').load_module(); print('BROTLI LOADED OK', [x for x in dir(m) if not x.startswith('__')][:12])"
          echo "LOAD OK"

      - name: Retag to two separate wheels (10_10 and 10_11)
        run: |
          set -x
          /usr/bin/python3 -m pip install --user --quiet wheel
          WD="$GITHUB_WORKSPACE/wheelhouse"
          SRC="$WD/$(ls "$WD" | grep '^aiohttp-.*\.whl$' | head -1)"
          echo "src=$SRC"
          # The source wheel is already tagged macosx_10_10_x86_64 -> keep it as the 10_10 deliverable.
          # Build the 10_11 deliverable from a copy in an isolated dir so wheel-tags output is unambiguous.
          mkdir -p /tmp/r11; cp "$SRC" /tmp/r11/
          C="/tmp/r11/$(basename "$SRC")"
          OUT=$(/usr/bin/python3 -m wheel tags --platform-tag macosx_10_11_x86_64 --remove "$C")
          echo "wheel-tags output: $OUT"
          cp /tmp/r11/aiohttp-*macosx_10_11_x86_64.whl "$WD"/
          echo "=== final wheelhouse ==="
          ls -la "$WD"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp34-spike-output
          if-no-files-found: warn
          path: |
            wheelhouse/**
            /tmp/raw-configure.log
            /tmp/raw-make.log
            /tmp/raw-install.log
            /tmp/wheel-build.log
