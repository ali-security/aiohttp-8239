name: cp34-macos-spike
on:
  push:
    branches: [spike/macos-cp34-src]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.10"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout (spike branch tree)
        uses: actions/checkout@v4

      - name: Env dump
        run: |
          set -x
          uname -a; sw_vers || true; clang --version; xcrun --show-sdk-path; xcrun --show-sdk-version

      - name: Install pyenv
        run: brew install pyenv || brew upgrade pyenv || true

      - name: pyenv install 3.4.10 (zlib from SDK; ssl/ensurepip failure is benign)
        continue-on-error: true
        run: |
          set -x
          export PYENV_ROOT="$HOME/.pyenv"
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          export CPPFLAGS="$CFLAGS"
          # --without-ensurepip avoids the no-_ssl ensurepip failure that makes pyenv report BUILD FAILED
          export PYTHON_CONFIGURE_OPTS="--without-ensurepip"
          set +e
          pyenv install -v -f 3.4.10 2>&1 | tee /tmp/pyenv-3410.log
          echo "pyenv exit: ${PIPESTATUS[0]}"
          exit 0

      - name: Verify pyenv python (must have zlib)
        id: findpy
        run: |
          set -x
          PY="$HOME/.pyenv/versions/3.4.10/bin/python3.4"
          ls -la "$HOME/.pyenv/versions/3.4.10/bin/" || true
          [ -x "$PY" ] || { echo "PYENV PYTHON MISSING"; echo "py=" >> "$GITHUB_OUTPUT"; exit 0; }
          "$PY" -c "import sys,platform; print(sys.version); print(platform.machine())"
          "$PY" -c "import zlib; print('zlib OK', zlib.ZLIB_VERSION)"
          "$PY" -c "import zipfile; zipfile._check_compression(zipfile.ZIP_DEFLATED); print('DEFLATE OK')"
          file "$PY" || true
          echo "py=$PY" >> "$GITHUB_OUTPUT"

      - name: Pre-fetch build deps
        if: steps.findpy.outputs.py != ''
        run: |
          set -x
          mkdir -p /tmp/wh; cd /tmp/wh
          curl -sSLO https://files.pythonhosted.org/packages/6b/6a/fa8d20fb8b661854a7140e290c52693ab3e8afdc9a8a7bf1194d9a227918/Cython-0.27.1-cp34-cp34m-macosx_10_6_intel.macosx_10_9_intel.macosx_10_9_x86_64.macosx_10_10_intel.macosx_10_10_x86_64.whl
          curl -sSLO https://files.pythonhosted.org/packages/91/af/18d58ed8a8e7e6b91d71b0367034faf8ea41e1004018811388ed07a7f2d6/setuptools-43.0.0-py2.py3-none-any.whl
          curl -sSLO https://files.pythonhosted.org/packages/0c/80/16a85b47702a1f47a63c104c91abdd0a6704ee8ae3b4ce4afc49bc39f9d9/wheel-0.30.0-py2.py3-none-any.whl
          ls -la

      - name: Install build deps into site-packages
        id: deps
        if: steps.findpy.outputs.py != ''
        run: |
          set -x
          PY="${{ steps.findpy.outputs.py }}"
          SP="$("$PY" -c 'import site; print(site.getsitepackages()[0])')"
          cd /tmp/wh
          for w in *.whl; do "$PY" -m zipfile -e "$w" "$SP"; done
          "$PY" -c "import Cython, setuptools, wheel; print('Cython', Cython.__version__, 'setuptools', setuptools.__version__, 'wheel', wheel.__version__)"

      - name: Build aiohttp wheel
        id: wheel
        if: steps.findpy.outputs.py != ''
        run: |
          set -x
          PY="${{ steps.findpy.outputs.py }}"
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          export ARCHFLAGS="-arch x86_64"
          export MACOSX_DEPLOYMENT_TARGET=10.10
          "$PY" setup.py bdist_wheel -d "$GITHUB_WORKSPACE/wheelhouse" 2>&1 | tee /tmp/wheel-build.log
          ls -la "$GITHUB_WORKSPACE/wheelhouse"

      - name: Verify .so (x86_64 + dep-free load) and retag 10_10/10_11
        id: verify
        if: steps.findpy.outputs.py != ''
        run: |
          set -x
          PY="${{ steps.findpy.outputs.py }}"
          WHL=$(ls "$GITHUB_WORKSPACE"/wheelhouse/aiohttp-*.whl 2>/dev/null | head -1)
          echo "WHL=$WHL"
          [ -z "$WHL" ] && { echo "NO WHEEL"; exit 1; }
          echo "=== wheel contents ==="
          "$PY" -m zipfile -l "$WHL"
          echo "=== brotli so present? ==="
          "$PY" -m zipfile -l "$WHL" | grep -E '_vendored/_brotli.*\.so' && echo "BROTLI SO PRESENT" || { echo "BROTLI SO MISSING (pure-python fallback!)"; exit 1; }
          mkdir -p /tmp/whx; "$PY" -m zipfile -e "$WHL" /tmp/whx
          SO=$(find /tmp/whx -name '_brotli*.so' | head -1)
          echo "SO=$SO"
          lipo -info "$SO" || file "$SO"
          lipo -info "$SO" | grep -qE 'Non-fat.*x86_64|architecture x86_64' && echo "ARCH x86_64 OK"
          "$PY" -c "import importlib.util as u; s=u.spec_from_file_location('_brotli', '$SO'); m=u.module_from_spec(s); s.loader.exec_module(m); print('BROTLI LOADED OK', [x for x in dir(m) if not x.startswith('__')][:12])"
          echo "LOAD OK"
          # Retag to 10_10 and add 10_11 using system python's wheel
          /usr/bin/python3 -m pip install --user --quiet wheel
          /usr/bin/python3 -m wheel tags --platform-tag macosx_10_10_x86_64 --remove "$WHL"
          NEW=$(ls "$GITHUB_WORKSPACE"/wheelhouse/aiohttp-*macosx_10_10_x86_64.whl 2>/dev/null | head -1)
          echo "retagged 10_10: $NEW"
          /usr/bin/python3 -m wheel tags --platform-tag macosx_10_11_x86_64 "$NEW"
          echo "=== final wheelhouse ==="
          ls -la "$GITHUB_WORKSPACE/wheelhouse"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp34-spike-output
          if-no-files-found: warn
          path: |
            wheelhouse/**
            /tmp/pyenv-3410.log
            /tmp/wheel-build.log
